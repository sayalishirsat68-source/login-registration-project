<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NGO Foundation</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 480px;
            margin: 50px auto;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }
        .auth-title {
            text-align: center;
            color: #1f3a52;
            margin-bottom: 8px;
            font-size: 26px;
        }
        .auth-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #218739;
        }
        .auth-btn {
            width: 100%;
            background-color: #218739;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .auth-btn:hover {
            background-color: #198754;
        }
        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }
        .auth-footer a {
            color: #218739;
            text-decoration: none;
            font-weight: 600;
        }
        .demo-box {
            margin-top: 20px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 6px;
            font-size: 13px;
            color: #475569;
            text-align: center;
        }
        .demo-box button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 6px;
        }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
            display: none;
        }
        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

    <!-- Header and Navigation -->
    <header class="navbar">
        <div class="logo"><span class="brand-mark" aria-hidden="true">SS</span> Hope Hand NGO</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about us.html">About Us</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="media.html">Media</a></li>
                <li><a href="join us.html">Join Us</a></li>
                <li><a href="compaign.html">Campaign</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="contact us.html">Contact Us</a></li>
                <li class="auth-nav-item"><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to manage NGO campaigns, volunteer projects, and records</p>

            <div id="alert-box" class="alert"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="auth-btn" id="submit-btn">Log In</button>
            </form>

            <div class="demo-box">
                <p><strong>Demo Credentials:</strong> admin@ngo.org / admin123</p>
                <button type="button" onclick="fillDemo()">Fill Demo Credentials</button>
            </div>

            <div class="auth-footer">
                Don't have an account yet? <a href="register.html">Register here</a>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        function fillDemo() {
            document.getElementById('email').value = 'admin@ngo.org';
            document.getElementById('password').value = 'admin123';
        }

        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');
        const submitBtn = document.getElementById('submit-btn');

        function validateLoginForm() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) {
                return 'Email and password are required.';
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                return 'Please enter a valid email address.';
            }
            if (password.length < 8) {
                return 'Password must be at least 8 characters long.';
            }
            return '';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const validationMessage = validateLoginForm();
            if (validationMessage) {
                alertBox.className = 'alert alert-error';
                alertBox.textContent = validationMessage;
                alertBox.style.display = 'block';
                return;
            }

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'same-origin'
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerHTML = `<strong>${data.message}</strong> Welcome, ${data.user.full_name} (${data.user.role}). Redirecting to Admin Dashboard...`;
                    alertBox.style.display = 'block';
                    localStorage.setItem('ngo_user', JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = 'about us.html';
                    }, 1200);
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.textContent = data.message || 'Login failed. Please verify credentials.';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert alert-error';
                alertBox.textContent = 'Unable to connect to server. Please try again.';
                alertBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In';
            }
        });
    </script>

</body>
</html>
